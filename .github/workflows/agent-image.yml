name: Build and Publish SkyOps Agent to GHCR

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'agent/**'
      - '.github/workflows/agent-image.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'agent/**'
      - '.github/workflows/agent-image.yml'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Optional custom version tag to apply (defaults to agent/VERSION if omitted)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Run Go Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: agent/go.sum

      - name: Run Go tests
        run: |
          go test -v -race ./...

      - name: Verify Go build
        run: |
          VERSION=$(cat VERSION 2>/dev/null || echo "v1.5.0")
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -trimpath -ldflags="-s -w -X main.Version=${VERSION}" -o /tmp/skyops-agent ./cmd/skyops-agent

  build-and-push:
    name: Build & Publish Container Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Agent Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            VERSION="${{ github.event.inputs.version_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [ -f agent/VERSION ]; then
            VERSION=$(cat agent/VERSION | tr -d '[:space:]')
          else
            VERSION="v1.5.0"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building SkyOps Agent version: ${VERSION}"

      - name: Resolve Image Name and Repository Owner
        id: image_meta
        run: |
          # Lowercase the repository owner to guarantee compliance with OCI and GHCR specifications
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_REPO="${REGISTRY}/${OWNER}/skyops-agent"
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT
          echo "image_repo=${IMAGE_REPO}" >> $GITHUB_OUTPUT
          echo "Target image repository: ${IMAGE_REPO}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_meta.outputs.image_repo }}
          tags: |
            # Tag with Git Commit SHA
            type=sha,format=short,prefix=sha-
            # Tag with SemVer on tag pushes
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Tag with authoritative agent version
            type=raw,value=${{ steps.get_version.outputs.version }}
            # Latest tag for main branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build and push Docker image
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          file: ./agent/Dockerfile
          build-args: |
            VERSION=${{ steps.get_version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

      - name: Generate Job Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### 🚀 SkyOps Agent Container Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Repository:** \`${{ steps.image_meta.outputs.image_repo }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** \`${{ steps.get_version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms:** \`linux/amd64\`, \`linux/arm64\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Manifest Digest:** \`${{ steps.build_push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Published Tags" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
